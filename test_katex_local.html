<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="http://localhost:8080/katex/katex.min.css">
    <script src="http://localhost:8080/katex/katex.min.js"></script>
    <script src="http://localhost:8080/katex/auto-render.min.js"></script>
</head>
<body>
    <div id="test">$(a^5)^2$</div>
    <script>
        window.onload = function() {
            try {
                window.renderMathInElement(document.getElementById('test'), {
                    delimiters: [
                        {left: "$$", right: "$$", display: true},
                        {left: "$", right: "$", display: false}
                    ]
                });
                console.log("SUCCESS");
                document.body.innerHTML += "<div>SUCCESS</div>";
            } catch (e) {
                console.error(e);
                document.body.innerHTML += "<div>ERROR: " + e.message + "</div>";
            }
        };
    </script>
</body>
</html>
